<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Invitation</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; --accent: #7f35ff; }
  body { font: 17px/1.5 -apple-system, system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f7; color: #1d1d1f; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } }
  main { max-width: 420px; padding: 24px 16px; text-align: center; }
  /* The app's PulseMark (PulseMarkView.swift): rings r=38/23 and a core
     r=8 in a 100-unit box, stroke 6, on the #4E00D4 -> #7F35FF tile with
     22% corners; a 2.4 s cycle, the second ring 0.6 s behind. */
  .mark { width: 120px; height: 120px; margin: 0 auto 24px; border-radius: 26.4px; overflow: hidden;
          background: linear-gradient(135deg, #4e00d4, #7f35ff); box-shadow: 0 10px 20px rgba(78, 0, 212, .45); }
  .mark svg { display: block; width: 100%; height: 100%; }
  .mark circle { transform-box: view-box; transform-origin: 50px 50px; }
  .ring { fill: none; stroke: #fff; stroke-width: 6; opacity: 0; animation: ring 2.4s ease-out infinite backwards; }
  .ring.second { animation-delay: .6s; }
  .core { fill: #fff; animation: core 2.4s linear infinite; }
  @keyframes ring { from { transform: scale(.55); opacity: .55; } to { transform: scale(1.05); opacity: 0; } }
  @keyframes core { 0% { transform: scale(1); } 15% { transform: scale(1.15); } 30%, 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .ring, .core { animation: none; } .ring { opacity: .35; } }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { opacity: .7; margin: 0 0 12px; }
  a.button { display: block; margin: 28px 0 14px; padding: 15px; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
  .small { font-size: 14px; }
  .error { color: #d4521f; opacity: 1; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 100 100">
      <circle class="ring" cx="50" cy="50" r="38"/>
      <circle class="ring second" cx="50" cy="50" r="23"/>
      <circle class="core" cx="50" cy="50" r="8"/>
    </svg>
  </div>
  <h1>You're invited to a home on Pulse</h1>
  <p id="lead">Open it in Pulse and sign in with your Pulse account. There's no password to remember.</p>
  <a class="button" id="open" href="#">Open in Pulse</a>
  <p class="small">Don't have Pulse yet? Install it, then come back to this page and tap Open in Pulse.</p>
</main>
<script>
  // The invitation code is the only thing this page handles. It goes
  // straight to the app; nothing is sent anywhere from here.
  var code = (new URLSearchParams(location.search).get("c") || "").replace(/[^A-Za-z0-9_-]/g, "");
  var open = document.getElementById("open");
  if (code) {
    open.href = "pulseha://invite/" + code;
    // Try the app once on arrival -- a QR scan lands here first.
    setTimeout(function () { location.href = open.href; }, 300);
  } else {
    open.style.display = "none";
    var lead = document.getElementById("lead");
    lead.textContent = "This link is missing its invitation. Ask for it again.";
    lead.className = "error";
  }
</script>
</body>
</html>
