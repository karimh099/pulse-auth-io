<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse sign-in</title>
<!-- Home Assistant reads this to know where to send the person back after
     they sign in. It is the whole point of this page: Pulse's client_id is
     this address, so it must stay here, unchanged. -->
<link rel="redirect_uri" href="pulseha://auth-callback">
<style>
  :root { color-scheme: light dark; }
  body { font: 17px/1.5 -apple-system, system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f7; color: #1d1d1f; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } }
  main { max-width: 420px; padding: 24px; text-align: center; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { opacity: .7; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Pulse</h1>
  <p>This is the address Pulse uses to sign in to your Home Assistant. Nothing to do here — go back to the app.</p>
</main>
</body>
</html>
